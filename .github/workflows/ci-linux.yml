name: ci-linux

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: Collect diagnostic GCC line/branch coverage
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - "**"
      - "!COPYING"
      - "!COPYING-asm"
      - "!INSTALL"
      - "!**.md"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-linux.yml"
  pull_request:
    paths:
      - "**"
      - "!COPYING"
      - "!COPYING-asm"
      - "!INSTALL"
      - "!**.md"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-linux.yml"

jobs:
  coverage:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build libboost-all-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install -r tests/support/coverage-requirements.txt
      - name: Install Catch2 v3
        run: |
          git clone --branch v3.8.1 --depth 1 https://github.com/catchorg/Catch2.git "$RUNNER_TEMP/Catch2"
          cmake -S "$RUNNER_TEMP/Catch2" -B "$RUNNER_TEMP/catch-build" -DCATCH_BUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/catch-install"
          cmake --build "$RUNNER_TEMP/catch-build" -j2
          cmake --install "$RUNNER_TEMP/catch-build"
      - name: Configure coverage
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DMDCOMP_ASSEMBLY_TESTS=OFF -DMDCOMP_STRESS_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install"
      - name: Build
        id: build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Collect diagnostic coverage
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/coverage-venv/bin/gcovr" --gcov-executable gcov-13 --root . --filter 'src/lib/' --filter 'include/mdcomp/' --xml-pretty --output build/coverage.xml build
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/coverage.xml').getroot()
          for name in ('lines-valid', 'lines-covered', 'branches-valid', 'branches-covered'):
              if int(root.attrib[name]) <= 0:
                  raise SystemExit(f'Empty coverage measurement: {name}')
          print({key: root.attrib[key] for key in ('line-rate', 'branch-rate')})
          PY
      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-coverage
          path: |
            build/coverage.xml
            build/Testing/Temporary/LastTest.log
            build/tests/failures/
  ci-linux:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build-ccache
    strategy:
      matrix:
        compiler: [gcc, clang]
        generator: [make, ninja]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
          - generator: make
            cmake_generator: "Unix Makefiles"
          - generator: ninja
            cmake_generator: "Ninja"
          - compiler: clang
            generator: ninja
            sanitize: true
    steps:
      - name: Install dependencies
        run: |
          if ! apt-fast -- help &> /dev/null; then
            sudo add-apt-repository -u -y ppa:apt-fast/stable
            sudo apt-get update
            echo debconf apt-fast/maxdownloads string 16 | sudo debconf-set-selections
            echo debconf apt-fast/dlflag boolean true | sudo debconf-set-selections
            echo debconf apt-fast/aptmanager string apt-get | sudo debconf-set-selections
            DEBIAN_FRONTEND=noninteractive sudo apt install -y apt-fast
          else
            sudo apt-fast update
          fi
          sudo apt-fast install -y libboost-all-dev ninja-build ccache
      - name: Set up GCC
        if: ${{ matrix.compiler == 'gcc' }}
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 13
      - name: Set up Clang
        if: ${{ matrix.compiler == 'clang' }}
        uses: egor-tensin/setup-clang@v1
        with:
          version: 19
      - name: Install Clang sanitizer runtimes
        if: ${{ matrix.sanitize }}
        run: sudo apt-fast install -y libclang-rt-19-dev
      - name: Checkout code
        uses: actions/checkout@master
        with:
          submodules: recursive
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-${{ matrix.compiler }}-${{ matrix.generator }}-${{ matrix.sanitize }}-ccache-${{ github.sha }}
          restore-keys: linux-${{ matrix.compiler }}-${{ matrix.generator }}-${{ matrix.sanitize }}-ccache-
      - name: Install Catch2 v3
        run: |
          git clone --branch v3.8.1 --depth 1 https://github.com/catchorg/Catch2.git "$RUNNER_TEMP/Catch2"
          cmake -S "$RUNNER_TEMP/Catch2" -B "$RUNNER_TEMP/catch-build" -DCATCH_BUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/catch-install"
          cmake --build "$RUNNER_TEMP/catch-build" -j2
          cmake --install "$RUNNER_TEMP/catch-build"
      - name: Import pinned Sega decoder sources
        run: python3 tests/support/import_sega_decoders.py --destination build-reference/sega-decoders
      - name: Configure
        env:
          OVERRIDE_CC: ${{ matrix.cc }}
          OVERRIDE_CXX: ${{ matrix.cxx }}
          SANITIZE: ${{ matrix.sanitize }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          export CC=$(which $OVERRIDE_CC)
          export CXX=$(which $OVERRIDE_CXX)
          extra_flags=()
          if [ "$SANITIZE" = true ]; then
            extra_flags+=(-DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer")
          fi
          if [[ "$SANITIZE" = true && ( "$EVENT_NAME" = schedule || "$EVENT_NAME" = workflow_dispatch ) ]]; then
            extra_flags+=(-DMDCOMP_STRESS_TESTS=ON)
          fi
          git submodule status --recursive
          "$CXX" --version
          cmake --version
          cmake -S . -B build -G "${{ matrix.cmake_generator }}" -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DMDCOMP_ASSEMBLY_TESTS=ON -DMDCOMP_SEGA_DECODER_DIR="$PWD/build-reference/sega-decoders" "${extra_flags[@]}"
      - name: Build
        run: |
          cmake --build build -j2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Preserve assembly failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asm-linux-${{ matrix.compiler }}-${{ matrix.generator }}
          path: |
            build/tests/asm/failures/
            build/tests/asm/*.tsv
            build/tests/asm/decoder_images.json
            build/tests/*-edges.tsv
            build/tests/failures/
            build/Testing/Temporary/LastTest.log
