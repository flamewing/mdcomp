name: ci-linux

on:
  push:
    paths:
      - '**'
      - '!COPYING'
      - '!COPYING-asm'
      - '!INSTALL'
      - '!**.md'
      - '!.clang*'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.github/workflows/*'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    paths:
      - '**'
      - '!COPYING'
      - '!COPYING-asm'
      - '!INSTALL'
      - '!**.md'
      - '!.clang*'
      - '!.gitignore'
      - '!.gitattributes'
      - '!.github/workflows/*'
      - '.github/workflows/ci-linux.yml'

jobs:
  ci-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        generator: [make, ninja]
        include:
          - compiler: gcc
            cc: gcc-12
            cxx: g++-12
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
          - generator: make
            cmake_generator: "Unix Makefiles"
          - generator: ninja
            cmake_generator: "Ninja"
    steps:
      - name: Install dependencies
        run: |
          if ! apt-fast -- help &> /dev/null; then
            sudo add-apt-repository -u -y ppa:apt-fast/stable
            sudo apt-get update
            echo debconf apt-fast/maxdownloads string 16 | sudo debconf-set-selections
            echo debconf apt-fast/dlflag boolean true | sudo debconf-set-selections
            echo debconf apt-fast/aptmanager string apt-get | sudo debconf-set-selections
            DEBIAN_FRONTEND=noninteractive sudo apt install -y apt-fast
          else
            sudo apt-fast update
          fi
          sudo apt-fast install -y libboost-all-dev ninja-build
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 12
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18
      - name: Checkout code
        uses: actions/checkout@master
      - name: Configure
        env:
          OVERRIDE_CC: ${{ matrix.cc }}
          OVERRIDE_CXX: ${{ matrix.cxx }}
        run: |
          export CC=$(which $OVERRIDE_CC)
          export CXX=$(which $OVERRIDE_CXX)
          cmake -S . -B build -G "${{ matrix.cmake_generator }}"
      - name: Build
        run: |
          cmake --build build -j2
