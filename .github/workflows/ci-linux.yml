name: ci-linux

on:
  push:
    paths:
      - "**"
      - "!COPYING"
      - "!COPYING-asm"
      - "!INSTALL"
      - "!**.md"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-linux.yml"
  pull_request:
    paths:
      - "**"
      - "!COPYING"
      - "!COPYING-asm"
      - "!INSTALL"
      - "!**.md"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-linux.yml"

jobs:
  ci-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        generator: [make, ninja]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
          - generator: make
            cmake_generator: "Unix Makefiles"
          - generator: ninja
            cmake_generator: "Ninja"
    steps:
      - name: Install dependencies
        run: |
          if ! apt-fast -- help &> /dev/null; then
            sudo add-apt-repository -u -y ppa:apt-fast/stable
            sudo apt-get update
            echo debconf apt-fast/maxdownloads string 16 | sudo debconf-set-selections
            echo debconf apt-fast/dlflag boolean true | sudo debconf-set-selections
            echo debconf apt-fast/aptmanager string apt-get | sudo debconf-set-selections
            DEBIAN_FRONTEND=noninteractive sudo apt install -y apt-fast
          else
            sudo apt-fast update
          fi
          sudo apt-fast install -y libboost-all-dev ninja-build
      - name: Set up GCC
        if: ${{ matrix.compiler == 'gcc' }}
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 13
      - name: Set up Clang
        if: ${{ matrix.compiler == 'clang' }}
        uses: egor-tensin/setup-clang@v1
        with:
          version: 19
      - name: Checkout code
        uses: actions/checkout@master
        with:
          submodules: recursive
      - name: Install Catch2 v3
        run: |
          git clone --branch v3.8.1 --depth 1 https://github.com/catchorg/Catch2.git "$RUNNER_TEMP/Catch2"
          cmake -S "$RUNNER_TEMP/Catch2" -B "$RUNNER_TEMP/catch-build" -DCATCH_BUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/catch-install"
          cmake --build "$RUNNER_TEMP/catch-build" -j2
          cmake --install "$RUNNER_TEMP/catch-build"
      - name: Import pinned Sega decoder sources
        run: python3 tests/support/import_sega_decoders.py --destination build-reference/sega-decoders
      - name: Configure
        env:
          OVERRIDE_CC: ${{ matrix.cc }}
          OVERRIDE_CXX: ${{ matrix.cxx }}
        run: |
          export CC=$(which $OVERRIDE_CC)
          export CXX=$(which $OVERRIDE_CXX)
          cmake -S . -B build -G "${{ matrix.cmake_generator }}" -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DMDCOMP_ASSEMBLY_TESTS=ON -DMDCOMP_SEGA_DECODER_DIR="$PWD/build-reference/sega-decoders"
      - name: Build
        run: |
          cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Preserve assembly failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asm-linux-${{ matrix.compiler }}-${{ matrix.generator }}
          path: |
            build/tests/asm/failures/
            build/tests/asm/*.tsv
            build/tests/asm/decoder_images.json
