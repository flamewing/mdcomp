name: ci-linux

on:
  push:
    paths-ignore: ['**.md', 'COPYING*', '.clang*']
  pull_request:
    paths-ignore: ['**.md', 'COPYING*', '.clang*']
  workflow_dispatch:
    inputs:
      coverage:
        description: Collect diagnostic GCC line/branch coverage
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERBOSE: "1"
  CTEST_PARALLEL_LEVEL: "2"

jobs:
  coverage:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest, pinned
        with:
          cmakeVersion: '4.2.3'
          ninjaVersion: '1.13.2'
      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build libboost-all-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install -r tests/support/coverage-requirements.txt
      - name: Install Catch2 v3
        env:
          CC: gcc-13
          CXX: g++-13
        run: python3 .github/scripts/bootstrap_catch.py --work "$RUNNER_TEMP/coverage-deps"
      - name: Configure coverage
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DMDCOMP_ASSEMBLY_TESTS=OFF -DMDCOMP_STRESS_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/coverage-deps/catch-install"
      - name: Build
        id: build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Collect diagnostic coverage
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/coverage-venv/bin/gcovr" --gcov-executable gcov-13 --root . --filter 'src/lib/' --filter 'include/mdcomp/' --xml-pretty --output build/coverage.xml build
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/coverage.xml').getroot()
          for name in ('lines-valid', 'lines-covered', 'branches-valid', 'branches-covered'):
              if int(root.attrib[name]) <= 0:
                  raise SystemExit(f'Empty coverage measurement: {name}')
          print({key: root.attrib[key] for key in ('line-rate', 'branch-rate')})
          PY
      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-coverage
          path: |
            build/coverage.xml
            build/Testing/Temporary/LastTest.log
            build/tests/failures/
  ci-linux:
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc, cxx: g++, generator: Ninja}
          - {os: ubuntu-latest, cc: gcc, cxx: g++, generator: Unix Makefiles}
          - {os: ubuntu-latest, cc: clang-19, cxx: clang++-19, generator: Ninja, sanitize: true}
          - {os: ubuntu-24.04-arm, cc: gcc, cxx: g++, generator: Ninja}
          - {os: ubuntu-24.04-arm, cc: clang-19, cxx: clang++-19, generator: Ninja}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/build-ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: lukka/get-cmake@da37b03df250c343a90268c30948f7814f31d88e # latest, pinned
        with:
          cmakeVersion: '4.2.3'
          ninjaVersion: '1.13.2'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-all-dev ccache python3-venv
          if [[ "$CXX" == clang* ]]; then
            sudo apt-get install -y clang-19 libclang-rt-19-dev
          fi
      - name: Cache compiler outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.cxx }}-${{ matrix.sanitize }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.cxx }}-${{ matrix.sanitize }}-
      - name: Install Catch2
        run: python3 .github/scripts/bootstrap_catch.py
      - name: Validate CI tooling
        run: python3 -B -m unittest discover -s .github/scripts/tests -v
      - name: Import pinned Sega decoders
        run: python3 tests/support/import_sega_decoders.py --destination build-reference/sega-decoders
      - name: Configure
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          flags=()
          if [[ "$SANITIZE" == true ]]; then
            flags+=("-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer")
            if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              flags+=(-DMDCOMP_STRESS_TESTS=ON)
            fi
          fi
          cmake -S . -B build -G '${{ matrix.generator }}' -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_PREFIX_PATH="$PWD/build-deps/catch-install" -DMDCOMP_ASSEMBLY_TESTS=ON -DMDCOMP_SEGA_DECODER_DIR="$PWD/build-reference/sega-decoders" "${flags[@]}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ github.job }}-${{ strategy.job-index }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/tests/asm/failures/
            build/tests/asm/*.tsv
            build/tests/asm/decoder_images.json
            build/tests/*-edges.tsv
            build/tests/failures/
