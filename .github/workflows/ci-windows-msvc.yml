name: ci-windows-msvc

on:
  push:
    paths:
      - "**"
      - "!COPYING"
      - "!COPYING-asm"
      - "!INSTALL"
      - "!**.md"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-windows-msvc.yml"
  pull_request:
    paths:
      - "**"
      - "!COPYING"
      - "!COPYING-asm"
      - "!INSTALL"
      - "!**.md"
      - "!.clang*"
      - "!.gitignore"
      - "!.gitattributes"
      - "!.github/workflows/*"
      - ".github/workflows/ci-windows-msvc.yml"

jobs:
  ci-windows-msvc:
    # Keep the runner image aligned with the Visual Studio 2022 generator.
    runs-on: windows-2022
    strategy:
      matrix:
        generator: [vs2022]
        include:
          - generator: vs2022
            cmake_generator: "Visual Studio 17 2022"
    steps:
      - name: Checkout code
        uses: actions/checkout@master
        with:
          submodules: recursive
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "5f96cd15fd745122cf27e0524606d6c1efc5fd07"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          python tests/support/import_reference.py --destination build-reference/published
          python tests/support/import_sega_decoders.py --destination build-reference/sega-decoders
          cmake -S . -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_FEATURES=tests -DBUILD_TESTING=ON -DMDCOMP_REFERENCE_BIN_DIR=${{ github.workspace }}/build-reference/published -DMDCOMP_REFERENCE_COMMIT=83ddc58527637d193b883606f8b94625574d2e0c -DMDCOMP_ASSEMBLY_TESTS=ON "-DMDCOMP_SEGA_DECODER_DIR=$PWD/build-reference/sega-decoders"
      - name: Build
        run: |
          cmake --build build --config Release -j2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Preserve assembly failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asm-msvc
          path: |
            build/tests/asm/failures/
            build/tests/asm/*.tsv
            build/tests/asm/decoder_images.json
