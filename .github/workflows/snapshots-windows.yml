name: snapshots-windows

on:
  schedule:
    - cron: "0 00 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  snapshots-windows:
    if: ${{ github.repository_owner == 'flamewing' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Activity check
        id: activity_check
        shell: bash
        run: |
          DATEUTC=$(curl -sL https://api.github.com/repos/flamewing/mdcomp/commits | jq -r '[.[]][0]' | jq -r '.commit.committer.date')
          TIMESTAMP=$(date --utc -d "$DATEUTC" +%s)
          DAYS=$(( ($(date --utc +%s) - $TIMESTAMP) / 86400 ))
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "repo_alive=true" >> $GITHUB_OUTPUT
          else
            if [ $DAYS -gt 0 ]; then
              echo "repo_alive=false" >> $GITHUB_OUTPUT
            else
              echo "repo_alive=true" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Install dependencies
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: base-devel git p7zip
            mingw-w64-i686-toolchain mingw-w64-i686-binutils mingw-w64-i686-ntldd mingw-w64-i686-boost mingw-w64-i686-cmake
      - name: Checkout code
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        uses: actions/checkout@master
      - name: Configure
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G 'Unix Makefiles'
      - name: Build
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        run: |
          cmake --build build -j2
      - name: Create package
        id: create_package
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        run: |
          for ff in $(${MSYSTEM_PREFIX}/bin/ntldd -R build/*.exe  | tr '\\' '/' | grep -io "$(cygpath -m ${MSYSTEM_PREFIX}).\+\.dll" | sort -u); do
            cp $(cygpath -u "$ff") build/
          done
          SNAPSHOT_PATH=$(cygpath -m $(pwd -P))
          echo "snapshot_path=${SNAPSHOT_PATH}" >> $GITHUB_OUTPUT
          export BUILDFILE="v0.2.0.$(date --utc +'%Y%m%d')"
          echo "buildfile=${BUILDFILE}" >> $GITHUB_OUTPUT
          cd build
          "/c/Program Files/7-Zip/7z.exe" -tzip a ${SNAPSHOT_PATH}/mdcomp-${BUILDFILE}.zip -mx9 -mmt *.{exe,dll}
      - name: VirusTotal Scan
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        id: scan_files
        uses: crazy-max/ghaction-virustotal@v2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ github.token }}
          update_release_body: true
          files: |
            ${{ steps.create_package.outputs.snapshot_path }}/mdcomp-${{ steps.create_package.outputs.buildfile }}.zip
      - name: Generate VirusTotal Body
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        run: |
          echo "Snapshot ${{ steps.create_package.outputs.buildfile }}" > ${{ steps.create_package.outputs.snapshot_path }}/body.txt
          echo "" >> ${{ steps.create_package.outputs.snapshot_path }}/body.txt
          echo "🛡 [VirusTotal GitHub Action](https://github.com/crazy-max/ghaction-virustotal) analysis:" >> ${{ steps.create_package.outputs.snapshot_path }}/body.txt
          echo "" >> ${{ steps.create_package.outputs.snapshot_path }}/body.txt
          analysis="${{ steps.scan_files.outputs.analysis }}"
          while read -d, -r pair; do
            IFS='=' read -r filename analysisURL <<<"$pair"
            echo "* [$(basename $filename)]($analysisURL)" >> ${{ steps.create_package.outputs.snapshot_path }}/body.txt
          done <<<"$analysis,"
      - name: Create release
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: snapshot-${{ steps.create_package.outputs.buildfile }}
          release_name: Snapshot ${{ steps.create_package.outputs.buildfile }}
          body_path: ${{ steps.create_package.outputs.snapshot_path }}/body.txt
          draft: true
          prerelease: false
      # Theses pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`.
      # See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
      - name: Upload snapshot
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.create_package.outputs.snapshot_path }}/mdcomp-${{ steps.create_package.outputs.buildfile }}.zip
          asset_name: mdcomp-${{ steps.create_package.outputs.buildfile }}.zip
          asset_content_type: application/zip
      - name: Finish release
        if: ${{ steps.activity_check.outputs.repo_alive == 'true' }}
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
